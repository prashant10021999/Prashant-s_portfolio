<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Solutions | Prashant Barnwal</title>
<style>
:root{color-scheme:light;font:16px/1.6 system-ui,sans-serif;--ink:#152941;--muted:#506378;--blue:#125aa3;--edge:#cad8e6;--page:#f3f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--edge)}
nav,main{width:min(1020px,calc(100% - 2rem));margin:auto}
nav{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.9rem 0}
a{color:var(--blue);text-underline-offset:.2em}nav a{font-weight:650}
main{padding:clamp(1.5rem,5vw,3rem) 0 3rem}h1,h2,h3,p{margin:0 0 .5rem}h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.045em;line-height:1.12}h2{font-size:1.35rem}h3{font-size:1.05rem}p,small{color:var(--muted)}
.controls{margin:1.4rem 0 1.75rem}label{display:block;font-weight:650}input,select,button{font:inherit;color:inherit}input,select{max-width:100%;width:32rem;border:1px solid #8197ae;border-radius:.55rem;background:#fff;padding:.55rem .75rem}select{width:auto;min-width:12rem}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1669ba;outline-offset:3px}
.collections{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;margin:.75rem 0 1.4rem}.collection{background:#fff;border:1px solid var(--edge);border-radius:.65rem;text-align:left;padding:.7rem .85rem;min-height:4.4rem}.collection strong,.collection small{display:block}.collection:hover,.collection[aria-pressed=true]{border-color:var(--blue)}.collection[aria-pressed=true]{background:#e5f0fc}.results-head{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;flex-wrap:wrap}.group{margin:1rem 0}.solution-list{list-style:none;padding:0;margin:.4rem 0}.solution-list li,.empty{background:#fff;border:1px solid var(--edge);border-radius:.55rem;padding:.7rem .85rem;margin:.45rem 0}.solution-list li{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;flex-wrap:wrap}.solution-list a:first-child{font-weight:650}.group-select{margin:.7rem 0 1rem}[hidden]{display:none!important}
.pdf-actions{display:flex;gap:.5rem 1rem;flex-wrap:wrap}
@media(max-width:690px){.collections{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:365px){.collections{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><nav aria-label="Site"><strong>Prashant Barnwal</strong><a href="../">Back to portfolio</a></nav></header>
<main>
<h1>Physics Solutions</h1>
<p>Find worked solutions by chapter, exam session, or question number.</p>
<div id="solution-search" class="controls"><label for="search">Search solutions</label><input id="search" type="search" placeholder="Try kinematics, 2024, or Q12" autocomplete="off"></div>
<section aria-labelledby="collections-title"><h2 id="collections-title">Collections</h2><div id="collections" class="collections"></div></section>
<section aria-labelledby="results-title">
<div class="results-head"><h2 id="results-title">All solutions</h2><span id="status" role="status"></span></div>
<div id="group-control" class="group-select" hidden><label for="group">Chapter or exam session</label><select id="group"></select></div>
<div id="sbt-browser" hidden>
  <h3>Choose a volume</h3>
  <div id="sbt-volumes" class="collections" role="group" aria-label="SBT volumes"></div>
  <div id="sbt-chapter-control" class="group-select" hidden>
    <label for="sbt-chapter">Choose a chapter</label>
    <select id="sbt-chapter"></select>
  </div>
  <div id="sbt-levels"></div>
</div>
<div id="results"></div>
<noscript><p>Enable JavaScript to browse the solutions.</p></noscript>
</section>
</main>
<template id="pdf-files">
{% for file in site.static_files %}
  {% assign folder = file.path | slice: 0, 19 %}
  {% assign extension = file.extname | downcase %}
  {% if folder == '/physics/solutions/' and extension == '.pdf' %}
    <span data-path="{{ file.path | escape }}"></span>
  {% endif %}
{% endfor %}
</template>
<script>
const collections = new Map([
  ['pathfinder', 'Pathfinder'], ['sbt', 'SBT'], ['jee-advanced', 'JEE Advanced PYQs'],
  ['jee-main', 'JEE Main PYQs'], ['csir-net', 'CSIR NET Physical Sciences'], ['gate', 'GATE Physics']
]);
const collator = new Intl.Collator('en', {numeric: true});
const formatGroup = slug => slug.split('-').map(word => {
  if (['ac', 'dc', 'emi', 'shm'].includes(word)) return word.toUpperCase();
  return word.charAt(0).toUpperCase() + word.slice(1);
}).join(' ');
const remoteRepositories = new Map([
  ['pathfinder', 'pathfinder-solutions'],
  ['jee-advanced', 'jee-advanced-solutions'], ['jee-main', 'jee-main-solutions']
]);
const pending = new Set(remoteRepositories.keys());
const unavailable = new Set();
const solutions = [];
const seen = new Set();
const questionPath = /^([a-z0-9]+(?:-[a-z0-9]+)*)\/q(\d+)\.pdf$/i;

const chapterPath = /^(0[1-9]|1[0-6])-([a-z0-9]+(?:-[a-z0-9]+)*)\.pdf$/i;

function addChapter(collection, path, url) {
  const match = chapterPath.exec(path);
  if (!match) return;
  const [, number, slug] = match;
  const key = [collection, 'chapter', number].join('/');
  if (seen.has(key)) return;
  seen.add(key);
  const group = number + ' · ' + formatGroup(slug.toLowerCase());
  solutions.push({collection, group, chapter: Number(number), question: null, url});
}

function addSolution(collection, path, url) {
  const match = questionPath.exec(path);
  if (!collections.has(collection) || !match) return;
  const [, group, number] = match;
  const question = Number(number);
  if (!Number.isSafeInteger(question) || question < 1) return;
  const key = [collection, group.toLowerCase(), question].join('/');
  if (seen.has(key)) return;
  seen.add(key);
  solutions.push({collection, group: formatGroup(group.toLowerCase()), question, url});
}

const files = document.querySelector('#pdf-files').content.querySelectorAll('[data-path]');
for (const file of files) {
  const path = file.dataset.path;
  const prefix = '/physics/solutions/';
  if (!path.startsWith(prefix)) continue;
  const [collection, group, name, extra] = path.slice(prefix.length).split('/');
  if (group && name && extra === undefined) {
    addSolution(collection, group + '/' + name, path.slice('/physics/'.length));
  }
}
const sbtVolumes = new Map([
  ['1', {repository: 'sbt-volume-1-solutions', chapters: [
    'basic-maths', 'kinematics', 'newtons-laws', 'work-power-and-energy', 'momentum-and-centre-of-mass',
    'rotational-motion', 'gravitation', 'fluids', 'surface-tension', 'viscosity', 'elasticity',
    'simple-harmonic-motion', 'wave-motion'
  ]}],
  ['2', {repository: 'sbt-volume-2-solutions', chapters: [
    'temperature-and-thermal-expansion', 'calorimetry', 'kinetic-theory-of-gases-and-gas-laws',
    'first-law-of-thermodynamics', 'heat-transfer', 'electrostatics', 'capacitor', 'current-electricity',
    'motion-of-charge-in-electromagnetic-field', 'magnetic-effect-of-current', 'electromagnetic-induction',
    'alternating-current', 'geometrical-optics', 'wave-optics', 'wave-particle-duality-and-atomic-physics',
    'nuclear-physics'
  ]}]
]);
const sbtPending = new Set(sbtVolumes.keys());
const sbtUnavailable = new Set();
const sbtCatalogs = new Map();
const levelNumbers = [1, 2, 3];
let sbtVolume = '';
let sbtChapter = '';

function chapterFolder(slug, number) {
  return String(number).padStart(2, '0') + '-' + slug;
}
function sortSolutions() {
  solutions.sort((a, b) => collator.compare(a.group, b.group) || a.question - b.question);
}
function repositoryUrl(repository) {
  return new URL('../../' + repository + '/', window.location.href);
}
async function readCatalog(base) {
  const response = await fetch(new URL('solutions/index.json', base));
  if (!response.ok) throw Error('Catalog unavailable');
  const paths = await response.json();
  if (!Array.isArray(paths)) throw Error('Invalid catalog');
  return paths;
}
async function loadCatalog(collection, repository) {
  const base = repositoryUrl(repository);
  const prefix = '/solutions/';
  try {
    const paths = await readCatalog(base);
    for (const path of paths) {
      if (typeof path !== 'string' || !path.startsWith(prefix)) continue;
      const relativePath = path.slice(prefix.length);
      if (questionPath.test(relativePath)) {
        addSolution(collection, relativePath, new URL(path.slice(1), base).href);
      } else if (collection === 'pathfinder' && chapterPath.test(relativePath)) {
        addChapter(collection, relativePath, new URL(path.slice(1), base).href);
      }
    }
  } catch {
    unavailable.add(collection);
  } finally {
    pending.delete(collection);
    sortSolutions();
    render();
  }
}
async function loadSbtLevels(volume, repository) {
  try {
    const paths = await readCatalog(repositoryUrl(repository));
    sbtCatalogs.set(volume, new Set(paths));
  } catch {
    sbtUnavailable.add(volume);
  } finally {
    sbtPending.delete(volume);
    render();
  }
}
sortSolutions();
const search = document.querySelector('#search');
const searchControl = document.querySelector('#solution-search');
const cards = document.querySelector('#collections');
const group = document.querySelector('#group');
const groupControl = document.querySelector('#group-control');
const results = document.querySelector('#results');
const title = document.querySelector('#results-title');
const status = document.querySelector('#status');
const sbtBrowser = document.querySelector('#sbt-browser');
const sbtVolumeButtons = document.querySelector('#sbt-volumes');
const sbtChapterControl = document.querySelector('#sbt-chapter-control');
const sbtChapterSelect = document.querySelector('#sbt-chapter');
const sbtLevels = document.querySelector('#sbt-levels');
let selected = '';

function add(parent, tag, content) {
  const element = document.createElement(tag);
  element.textContent = content;
  parent.append(element);
  return element;
}
function addPdfDownload(parent, url, label) {
  const download = add(parent, 'a', 'Download PDF');
  download.href = url;
  download.download = '';
  download.setAttribute('aria-label', 'Download ' + label + ' PDF');
}
function countLabel(count, label) { return count + ' ' + label + (count === 1 ? '' : 's'); }
function chooseSbtVolume(volume) {
  sbtVolume = volume;
  sbtChapter = '';
  const {chapters} = sbtVolumes.get(volume);
  sbtChapterSelect.replaceChildren(new Option('Select a chapter', ''));
  for (const [index, slug] of chapters.entries()) {
    sbtChapterSelect.append(new Option((index + 1) + ' · ' + formatGroup(slug), String(index + 1)));
  }
  render();
}
function renderSbtBrowser() {
  const volume = sbtVolumes.get(sbtVolume);
  status.textContent = volume ? countLabel(volume.chapters.length, 'chapter') : '';
  for (const button of sbtVolumeButtons.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.volume === sbtVolume));
  }
  sbtChapterControl.hidden = !volume;
  sbtLevels.replaceChildren();
  if (!volume || !sbtChapter) return;

  const number = Number(sbtChapter);
  const slug = volume.chapters[number - 1];
  const chapterTitle = formatGroup(slug);
  add(sbtLevels, 'h3', 'Chapter ' + number + ' · ' + chapterTitle);
  const list = add(sbtLevels, 'ul', '');
  list.className = 'solution-list';
  const catalog = sbtCatalogs.get(sbtVolume);
  const base = repositoryUrl(volume.repository);
  for (const level of levelNumbers) {
    const item = add(list, 'li', '');
    const label = 'Level ' + level;
    add(item, 'strong', label);
    const path = 'solutions/' + chapterFolder(slug, number) + '/level-' + level + '.pdf';
    if (catalog?.has('/' + path)) {
      const url = new URL(path, base).href;
      const actions = add(item, 'div', '');
      actions.className = 'pdf-actions';
      const view = add(actions, 'a', 'View PDF');
      view.href = url;
      view.setAttribute('aria-label', 'View ' + label + ' PDF');
      addPdfDownload(actions, url, label);
    } else {
      const message = sbtPending.has(sbtVolume) ? 'Checking…' :
        sbtUnavailable.has(sbtVolume) ? 'Temporarily unavailable' : 'Coming soon';
      add(item, 'small', message);
    }
  }
}
function render() {
  for (const button of cards.querySelectorAll('button')) {
    const id = button.dataset.collection;
    button.setAttribute('aria-pressed', String(id === selected));
    if (id === 'sbt') {
      button.querySelector('small').textContent = 'Volumes 1 and 2';
      continue;
    }
    const count = countLabel(solutions.filter(solution => solution.collection === id).length, 'solution');
    button.querySelector('small').textContent = pending.has(id) ? 'Loading…' :
      unavailable.has(id) ? count + ' · index unavailable' : count;
  }
  title.textContent = collections.get(selected) || 'All solutions';
  const browsingSbt = selected === 'sbt';
  sbtBrowser.hidden = !browsingSbt;
  searchControl.hidden = browsingSbt;
  results.hidden = browsingSbt;
  if (browsingSbt) {
    groupControl.hidden = true;
    renderSbtBrowser();
    return;
  }
  const inCollection = solutions.filter(solution => !selected || selected === solution.collection);
  const previousGroup = group.value;
  const groups = [...new Set(inCollection.map(solution => solution.group))];
  group.replaceChildren(new Option('All chapters and sessions', ''));
  for (const name of groups) group.append(new Option(name, name));
  group.value = groups.includes(previousGroup) ? previousGroup : '';
  groupControl.hidden = groups.length < 2;
  const tokens = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const matches = inCollection.filter(solution => {
    if (group.value && solution.group !== group.value) return false;
    const label = (collections.get(solution.collection) + ' ' + solution.group).toLowerCase();
    return tokens.every(token => {
      const explicit = /^q0*(\d+)$/.exec(token);
      if (explicit) return Number(explicit[1]) === solution.question;
      return label.includes(token) || (/^\d+$/.test(token) && Number(token) === solution.question);
    });
  });
  results.replaceChildren();
  const loading = selected ? pending.has(selected) : pending.size > 0;
  const missing = selected ? unavailable.has(selected) : unavailable.size > 0;
  status.textContent = loading ? 'Loading solutions…' : countLabel(matches.length, selected ? 'solution' : 'PDF') +
    (missing ? ' · some results may be missing' : '');
  if (!matches.length) {
    const message = loading ? 'Checking for published solutions…' : missing ?
      'A solution index is temporarily unavailable. Try again later.' : inCollection.length ?
      'No matches. Try a different question number or search term.' : 'Solutions will appear here as they are uploaded.';
    add(results, 'p', message).className = 'empty';
    return;
  }
  const lists = new Map();
  for (const solution of matches) {
    const label = selected ? solution.group : collections.get(solution.collection) + ' · ' + solution.group;
    if (!lists.has(label)) {
      const section = add(results, 'div', '');
      section.className = 'group';
      add(section, 'h3', label);
      const list = add(section, 'ul', '');
      list.className = 'solution-list';
      lists.set(label, list);
    }
    const item = add(lists.get(label), 'li', '');
    const documentLabel = solution.chapter ? 'Chapter ' + solution.chapter : 'Question ' + solution.question;
    add(item, 'a', documentLabel + ' (PDF)').href = solution.url;
    addPdfDownload(item, solution.url, documentLabel.toLowerCase());
  }
}
for (const [id, label] of collections) {
  const button = add(cards, 'button', '');
  button.type = 'button';
  button.className = 'collection';
  button.dataset.collection = id;
  add(button, 'strong', label);
  add(button, 'small', '');
  button.addEventListener('click', () => {
    selected = selected === id ? '' : id;
    group.value = '';
    render();
  });
}
for (const [volume, {chapters}] of sbtVolumes) {
  const button = add(sbtVolumeButtons, 'button', '');
  button.type = 'button';
  button.className = 'collection';
  button.dataset.volume = volume;
  add(button, 'strong', 'Volume ' + volume);
  add(button, 'small', countLabel(chapters.length, 'chapter'));
  button.addEventListener('click', () => chooseSbtVolume(volume));
}
sbtChapterSelect.addEventListener('change', () => {
  sbtChapter = sbtChapterSelect.value;
  render();
});
search.addEventListener('input', render);
group.addEventListener('change', render);
render();
for (const [collection, repository] of remoteRepositories) loadCatalog(collection, repository);
for (const [volume, {repository}] of sbtVolumes) loadSbtLevels(volume, repository);
</script>
</body>
</html>
